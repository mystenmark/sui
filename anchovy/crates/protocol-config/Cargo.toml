[package]
name = "protocol-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# A copy of sui's `sui-protocol-config` with its Move, fastcrypto, clap,
# Antithesis and RPC-rendering dependencies stripped (`src/shims.rs`), and its
# derive macros replaced by `macro_rules!` (`src/macros.rs`).
# `src/snapshots` are the reference's, renamed for this crate, and must not
# be updated, only added to.

[dependencies]
bs58.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true

# Copied code: the workspace's pedantic lints are not applied. `msim` is
# the reference's simulator cfg, never set here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(msim)"] }
