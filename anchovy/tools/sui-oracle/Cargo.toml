[package]
name = "sui-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Outside the messages workspace: this is the one place that links sui-types,
# and only to write test vectors.
[workspace]

[dependencies]
sui-types = { path = "../../../crates/sui-types" }
sui-protocol-config = { path = "../../../crates/sui-protocol-config" }
nonempty = "0.9"
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
roaring = "=0.11.4"
base64ct = { version = "=1.8.0", features = ["alloc"] }
rand = "0.8.5"
move-core-types = { path = "../../../external-crates/move/crates/move-core-types" }
bcs = "0.1.6"
