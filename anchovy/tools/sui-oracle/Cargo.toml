[package]
name = "sui-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Outside the messages workspace: this is the one place that links sui-types,
# and only to write test vectors.
[workspace]

[dependencies]
sui-types = { path = "../../../crates/sui-types" }
sui-protocol-config = { path = "../../../crates/sui-protocol-config" }
nonempty = "0.9"
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
roaring = "=0.11.4"
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce", package = "fastcrypto-zkp" }
shared-crypto = { path = "../../../crates/shared-crypto" }
base64ct = { version = "=1.8.0", features = ["alloc"] }
rand = "0.8.5"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
move-core-types = { path = "../../../external-crates/move/crates/move-core-types" }
bcs = "0.1.6"

# As validators run it: fastcrypto-zkp's u8 claim-offset arithmetic wraps in
# release and panics with overflow checks.
[profile.dev.package.fastcrypto-zkp]
overflow-checks = false

# As validators run it: `zip_debug_eq` truncates in release and panics with
# debug assertions (multisig signatures and bitmap out of step).
[profile.dev.package.mysten-common]
debug-assertions = false
