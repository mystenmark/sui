[workspace]
resolver = "2"
members = [
    "crates/arena",
    "crates/containers",
    "crates/exec-types",
    "crates/execution",
    "crates/executor",
    "crates/messages",
    "crates/natives",
    "crates/protocol-config",
    "crates/store",
    "crates/validation",
    "crates/validator",
    "crates/workqueue",
]
exclude = ["tools/sui-oracle", "tools/validator-client"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Pinned to the version in sui's Cargo.lock: accept/reject behaviour must match.
bcs = "=0.1.6"
# The crate behind fastcrypto's Blake2b256, at the version sui's lockfile has.
blake2 = "=0.10.6"
# The revision sui's typed-store uses.
tidehunter = { git = "https://github.com/mystenlabs/tidehunter.git", rev = "f8bc93cf6a973d31fbbe6fa7c2b643ddd8e83ddf" }
tempfile = "3.20.0"
# Sui's executor, its types and its framework, linked only by `execution`.
sui-execution = { path = "../sui-execution" }
sui-framework = { path = "../crates/sui-framework" }
sui-protocol-config = { path = "../crates/sui-protocol-config" }
sui-types = { path = "../crates/sui-types" }
move-core-types = { path = "../external-crates/move/crates/move-core-types" }
move-binary-format = { path = "../external-crates/move/crates/move-binary-format" }
move-vm-runtime = { path = "../external-crates/move/crates/move-vm-runtime" }
# Linked by `natives`, as sui-move-natives links them.
better_any = "0.1.1"
smallvec = "1.10.0"
rand = "0.8.5"
fastcrypto-vdf = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce", features = ["experimental"] }
prometheus = "0.14"
arena = { path = "crates/arena" }
containers = { path = "crates/containers" }
execution = { path = "crates/execution" }
executor = { path = "crates/executor" }
exec-types = { path = "crates/exec-types" }
natives = { path = "crates/natives" }
messages = { path = "crates/messages" }
protocol-config = { path = "crates/protocol-config" }
store = { path = "crates/store" }
validation = { path = "crates/validation" }
workqueue = { path = "crates/workqueue" }
# Two versions of the allocator trait: hashbrown and its Vec use 0.2,
# arena-btreemap uses 0.4. The arena implements both.
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
allocator-api2-04 = { package = "allocator-api2", version = "0.4", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17", default-features = false, features = ["allocator-api2", "default-hasher", "inline-more"] }
foldhash = { version = "0.2", default-features = false }
arena-btreemap = "0.1.2"
# Test oracle for containers::IndexMap.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-reflection = "0.5.0"
serde_yaml = "0.9"
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
bs58 = "0.5"
# Crypto is fastcrypto's (PRD), at sui's revision; base64ct and roaring at
# the versions sui decodes signatures with.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
base64ct = { version = "=1.8.0", features = ["alloc"] }
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce", package = "fastcrypto-zkp" }
roaring = "=0.11.4"
# The map type fastcrypto-zkp takes JWKs in.
imbl = "7"
insta = { version = "1", features = ["yaml"] }
# The gRPC stack, at the versions in sui's lockfile.
bytes = "1.11"
crossbeam-channel = "0.5.15"
prost = "0.14.1"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", default-features = false }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-build = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
# TLS as sui-tls configures it: ring, TLS 1.3, a self-signed Ed25519 cert.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
base64 = "0.22"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Dependencies optimized in dev and test builds: zkLogin's proof check
# (arkworks) is otherwise far too slow for the reference vectors.
[profile.dev.package."*"]
opt-level = 2

# fastcrypto-zkp adds claim offsets in u8 (`decode_base64_url`), which
# wraps harmlessly in release but panics with overflow checks on crafted
# signatures; build it everywhere as release does.
[profile.dev.package.fastcrypto-zkp]
overflow-checks = false

[profile.release]
debug = true

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
